<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RIFT Queue</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 900px; padding: 32px 18px 80px; line-height: 1.5; }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 24px; }
    h2 { font-size: 1rem; margin: 30px 0 12px; }
    form, .job { border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 8px; padding: 14px; }
    form { display: grid; gap: 12px; }
    input, select, button { box-sizing: border-box; font: inherit; padding: 9px 10px; }
    button { cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; }
    .jobs { display: grid; gap: 9px; }
    .job { display: grid; grid-template-columns: 44px 150px minmax(0, 1fr) 100px 90px 60px; gap: 12px; align-items: center; }
    .muted { opacity: .62; font-size: .88rem; }
    .mine { border-color: #4d8cff; }
    .files a { display: block; margin-top: 7px; }
    .params { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .params label { font-size: .88rem; }
    .params input, .params select { width: 100%; margin-top: 3px; }
    #login { max-width: 420px; margin: 0 0 24px auto; }
    #app[hidden], #login[hidden] { display: none; }
    [hidden] { display: none !important; }
    #login { margin-bottom: 22px; }
    #logout { margin-left: 8px; padding: 4px 9px; font-size: .85rem; }
    h1 { display: flex; align-items: center; gap: 10px; }
    .inline-login { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; border: 0; padding: 0; }
    .inline-login input { width: 150px; }
    @media (max-width: 650px) {
      h1 { align-items: flex-start; flex-wrap: wrap; }
      .inline-login { width: 100%; margin-left: 0; }
      .row, .job { grid-template-columns: 1fr; }
      .params { grid-template-columns: repeat(2, 1fr); }
      .job { gap: 3px; }
    }
    .logout { margin-left: 8px; }
    .params-view { margin-top: 6px; font-size: .8rem; opacity: .72; }
    .owner { white-space: nowrap; }
    .queue-number { font-variant-numeric: tabular-nums; font-weight: 700; color: #9ec1ff; }
    .queue-head { display: grid; grid-template-columns: 44px 150px 1fr 100px 90px 60px; gap: 12px; padding: 0 14px 6px; color: #888f9c; font-size: .78rem; }
    .queue-head span:last-child { text-align: right; }
  </style>
</head>
<body>
  <main id="app">
    <h1>RIFT Queue <span id="identity" class="muted">未登录</span><form id="login-form" class="inline-login"><input id="token" type="password" placeholder="口令" required autocomplete="current-password"><button type="submit">登录</button><button id="logout" hidden type="button">退出</button><span id="login-error" class="muted"></span></form></h1>
    <form id="submit-form">
      <div class="row">
        <input name="title" maxlength="100" placeholder="任务名 / 歌曲名" required>
        <select name="kind" id="kind" required>
          <option value="rift" selected>RIFT</option>
          <option value="background">去背景</option>
          <option value="deharmony">去和声</option>
          <option value="dereverb">去混响</option>
        </select>
        <input name="upload" type="file" accept="audio/*,.wav,.flac,.m4a,.mp3,.ogg,.opus" required>
      </div>
      <div id="rift-params" class="params">
        <label>变调 <input name="key_shift" type="number" min="-24" max="24" value="0"></label>
        <label>步数 <input name="steps" type="number" min="2" max="128" value="32"></label>
        <label>DS CFG <input name="ds" type="number" min="0" max="2" step="0.05" value="0.2"></label>
        <label>说话人 CFG <input name="spk" type="number" min="0" max="2" step="0.05" value="0.8"></label>
        <label>CFG 重采样 <input name="cfg_rescale" type="number" min="0" max="2" step="0.05" value="0.7"></label>
        <label>F0 <select name="robust_f0"><option value="0" selected>关闭</option><option value="1">稳健</option><option value="2">强</option></select></label>
        <label>随机种子 <input name="seed" type="number" min="0" value="7"></label>
      </div>
      <button>提交</button>
      <div id="submit-status" class="muted"></div>
    </form>
    <h2>队列</h2>
    <div class="queue-head"><span>序号</span><span>提交人</span><span>标题</span><span>类型</span><span>状态</span></div>
    <div id="jobs" class="jobs"></div>
  </main>

  <script>
    const labels = {queued:'○ 等待',running:'● 处理中',succeeded:'✓ 完成',failed:'× 失败',cancelled:'— 已取消'};
    let token = '';
    const expanded = new Set();
    const kind = document.querySelector('#kind');
    const params = document.querySelector('#rift-params');
    kind.addEventListener('change', () => { params.hidden = kind.value !== 'rift'; });
    const headers = () => token ? {Authorization: `Bearer ${token}`} : {};
    async function request(path, options={}) {
      options.headers = {...(options.headers || {}), ...headers()};
      const response = await fetch(path, options);
      if (!response.ok) {
        let detail = `${response.status}`;
        try { detail = (await response.json()).detail || detail; } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }
    async function enter() {
      const me = await request('/api/me');
      document.querySelector('#identity').textContent = `— ${me.username}`;
      document.querySelector('#logout').hidden = false;
      document.querySelector('#token').hidden = true;
      document.querySelector('#login-form button[type="submit"]').hidden = true;
      document.querySelector('#submit-form').hidden = false;
      await refresh();
    }
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault(); token = document.querySelector('#token').value;
      try {
        await request('/api/session', {method:'POST'}); token = ''; document.querySelector('#token').value = ''; await enter();
      } catch (error) { document.querySelector('#login-error').textContent = error.message; }
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/api/session', {method:'DELETE', headers: headers()});
      token = ''; document.querySelector('#logout').hidden = true;
      document.querySelector('#token').hidden = false;
      document.querySelector('#login-form button[type="submit"]').hidden = false;
      document.querySelector('#submit-form').hidden = true;
      document.querySelector('#identity').textContent = '未登录'; await refresh();
    });
    document.querySelector('#submit-form').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.querySelector('#submit-status'); status.textContent = '上传中…';
      try {
        await request('/api/jobs', {method:'POST', body:new FormData(event.target)});
        event.target.reset(); status.textContent = '已进入队列'; await refresh();
      } catch (error) { status.textContent = error.message; }
    });
    async function detail(id) {
      const job = await request(`/api/jobs/${id}`);
      const target = document.querySelector(`[data-files="${id}"]`);
      expanded.add(id);
      target.innerHTML = '';
      for (const file of job.files || []) {
        const link = document.createElement('a'); link.textContent = file.name; link.href = '#';
        link.href = file.url; link.download = file.name;
        target.appendChild(link);
      }
    }
    async function refresh() {
      const jobs = await request('/api/jobs'); const root = document.querySelector('#jobs'); root.innerHTML = '';
      for (const job of jobs) {
        const node = document.createElement('div'); node.className = `job ${job.owned ? 'mine' : ''}`;
        const number = document.createElement('strong'); number.className = 'queue-number'; number.textContent = job.queue_position || '—';
        const owner = document.createElement('strong'); owner.className = 'owner'; owner.textContent = job.username;
        const summary = document.createElement('div');
        const title = document.createElement('div'); title.textContent = job.title;
        const model = document.createElement('div'); model.className = 'params-view';
        if (job.kind === 'rift' && job.params && expanded.has(job.id)) model.textContent = Object.entries(job.params).map(([key, value]) => `${key} ${value}`).join(' · ');
        const meta = document.createElement('div'); meta.className = 'muted';
        meta.textContent = expanded.has(job.id) ? `${job.id.slice(0,8)}` : '';
        const files = document.createElement('div'); files.className = 'files'; files.dataset.files = job.id;
        summary.append(title, model, meta, files);
        const kind = document.createElement('span'); kind.textContent = job.kind_label;
        const state = document.createElement('span'); state.textContent = labels[job.status];
        node.append(number, owner, summary, kind, state);
        if (job.owned && job.status === 'queued') {
          const cancel = document.createElement('button'); cancel.textContent = '取消';
          cancel.onclick = async event => { event.stopPropagation(); await request(`/api/jobs/${job.id}/cancel`, {method:'POST'}); await refresh(); };
          node.appendChild(cancel);
        }
        if (job.owned) {
          node.onclick = () => { if (job.status === 'succeeded') detail(job.id); else { expanded.has(job.id) ? expanded.delete(job.id) : expanded.add(job.id); refresh(); } };
          if (expanded.has(job.id) && job.status === 'succeeded') detail(job.id).catch(() => {});
        }
        root.appendChild(node);
      }
    }
    enter().catch(() => {});
    setInterval(() => document.querySelector('#app').hidden || refresh().catch(()=>{}), 5000);
  </script>
</body>
</html>
