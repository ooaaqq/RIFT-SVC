<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RIFT Queue</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 900px; padding: 32px 18px 80px; line-height: 1.5; }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0; }
    h2 { font-size: 1rem; margin: 30px 0 12px; }
    form, .job { border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 8px; padding: 14px; }
    form { display: grid; gap: 12px; }
    input, select, button { box-sizing: border-box; font: inherit; padding: 9px 10px; }
    .select-wrap { position: relative; min-width: 0; }
    .select-wrap::after { content: ''; position: absolute; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; right: 14px; top: 50%; transform: translateY(-65%) rotate(45deg); pointer-events: none; opacity: .7; }
    .select-wrap select { appearance: none; width: 100%; padding-right: 38px; }
    .select-wrap option { color: #f2f4f8; background: #292b2f; }
    button { cursor: pointer; }
    .row { display: grid; grid-template-columns: minmax(220px, 1.35fr) 150px minmax(220px, 1fr) 175px; gap: 10px; }
    .jobs { display: grid; gap: 9px; }
    .job { padding: 14px; }
    .job-main { display: grid; grid-template-columns: 44px 150px minmax(0, 1fr) 100px 90px 60px; gap: 12px; align-items: center; }
    .job-main > *, .queue-head > * { text-align: left; }
    .muted { opacity: .62; font-size: .88rem; }
    .mine { border-color: #4d8cff; }
    .files a { display: block; margin-top: 7px; }
    .params { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .params label { font-size: .88rem; }
    .params .select-wrap { display: block; }
    .params input, .params select { width: 100%; margin-top: 3px; }
    #login { max-width: 420px; margin: 0 0 24px auto; }
    #app[hidden], #login[hidden] { display: none; }
    [hidden] { display: none !important; }
    #login { margin-bottom: 22px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .account { display: flex; align-items: center; justify-content: flex-end; gap: 9px; min-width: 0; }
    #logout { margin: 0; padding: 5px 9px; font-size: .85rem; }
    .inline-login { display: flex; align-items: center; gap: 7px; margin: 0; border: 0; padding: 0; }
    .inline-login input { width: 150px; }
    @media (max-width: 650px) {
      .topbar { align-items: flex-start; flex-wrap: wrap; }
      .account { width: 100%; justify-content: flex-start; }
      .inline-login { flex: 1; }
      .row, .job-main { grid-template-columns: 1fr; }
      .params { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .job-main { gap: 3px; }
    }
    .logout { margin-left: 8px; }
    .job-details { display: grid; gap: 12px; margin-top: 12px; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 16px; }
    .detail-item { min-width: 0; }
    .detail-label { display: block; font-size: .75rem; opacity: .6; }
    .detail-value { display: block; margin-top: 2px; overflow-wrap: anywhere; }
    .detail-id { margin-top: 10px; font-size: .76rem; opacity: .62; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .params-view { font-size: .84rem; }
    .model-links { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .mock-file { opacity: .72; }
    .cancel { border: 0; background: transparent; padding: 4px 0; color: #d66; }
    .owner { white-space: nowrap; }
    .queue-number { font-variant-numeric: tabular-nums; font-weight: 700; color: #9ec1ff; }
    .queue-head { display: grid; grid-template-columns: 44px 150px minmax(0, 1fr) 100px 90px 60px; gap: 12px; padding: 0 14px 6px; color: #888f9c; font-size: .78rem; }
    .queue-head span:last-child { text-align: left; }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1>RIFT Queue</h1>
      <div class="account">
        <span id="identity" class="muted">未登录</span>
        <form id="login-form" class="inline-login">
          <input id="token" type="password" placeholder="口令" required autocomplete="current-password">
          <button type="submit">登录</button>
          <button id="logout" hidden type="button">退出</button>
          <span id="login-error" class="muted"></span>
        </form>
      </div>
    </header>
    <form id="submit-form" hidden>
      <div class="row">
        <input name="title" maxlength="100" placeholder="任务名 / 歌曲名" required>
        <div class="select-wrap">
          <select name="kind" id="kind" required>
            <option value="rift" selected>RIFT</option>
            <option value="background">去背景</option>
            <option value="deharmony">去和声</option>
            <option value="dereverb">去混响</option>
          </select>
        </div>
        <div class="select-wrap">
          <select name="model" id="model" required aria-label="模型"></select>
        </div>
        <input name="upload" type="file" accept="audio/*,.wav,.flac,.m4a,.mp3,.ogg,.opus" required>
      </div>
      <div id="rift-params" class="params">
        <label>变调 <input name="key_shift" type="number" min="-24" max="24" value="0"></label>
        <label>步数 <input name="steps" type="number" min="2" max="128" value="32"></label>
        <label>DS CFG <input name="ds" type="number" min="0" max="2" step="0.05" value="0.2"></label>
        <label>说话人 CFG <input name="spk" type="number" min="0" max="2" step="0.05" value="0.8"></label>
        <label>CFG 重采样 <input name="cfg_rescale" type="number" min="0" max="2" step="0.05" value="0.7"></label>
        <label>F0 <span class="select-wrap"><select name="robust_f0"><option value="0" selected>关闭</option><option value="1">稳健</option><option value="2">强</option></select></span></label>
        <label>随机种子 <input name="seed" type="number" min="0" value="7"></label>
      </div>
      <button>提交</button>
      <div id="submit-status" class="muted"></div>
    </form>
    <h2>队列</h2>
    <div class="queue-head"><span>序号</span><span>提交人</span><span>标题</span><span>类型</span><span>状态</span><span>操作</span></div>
    <div id="jobs" class="jobs"></div>
  </main>

  <script>
    const labels = {queued:'○ 等待',running:'● 处理中',succeeded:'✓ 完成',failed:'× 失败',cancelled:'— 已取消'};
    const paramLabels = {key_shift:'变调', steps:'步数', ds:'DS CFG', spk:'说话人 CFG', cfg_rescale:'CFG 重采样', robust_f0:'F0', seed:'随机种子'};
    const f0Labels = {0:'关闭', 1:'稳健', 2:'强'};
    const modelCatalog = {
      rift: [{name:'RIFT25K', url:'https://huggingface.co/ooaaqq/rift-svc-luzao-25k'}],
      background: [{
        name:'Big Beta 7 + BS-RoFormer Mag · Max Spec',
        links:[
          {name:'Big Beta 7', url:'https://huggingface.co/pcunwa/Mel-Band-Roformer-big'},
          {name:'BS-RoFormer Mag', url:'https://huggingface.co/anvuew/BS_RoFormer_mag'}
        ]
      }],
      deharmony: [
        {name:'Anvuew Karaoke BS-RoFormer', url:'https://huggingface.co/anvuew/karaoke_bs_roformer'},
        {name:'Becruily Frazer Karaoke', url:'https://huggingface.co/becruily/bs-roformer-karaoke'},
        {name:'Small Karaoke GaboxAUFR', url:'https://huggingface.co/GaboxR67/MelBandRoformers'}
      ],
      dereverb: [
        {name:'Anvuew Dereverb BS-RoFormer 22.5050', url:'https://huggingface.co/anvuew/dereverb_bs_roformer'},
        {name:'Dereverb BS-RoFormer（模拟候选）', url:'https://huggingface.co/anvuew/dereverb_bs_roformer', mock:true}
      ]
    };
    const mockFiles = {
      rift: ['mock-rift-vocal.wav', 'mock-rift-manifest.json'],
      background: ['mock-background-vocal.wav', 'mock-background-instrumental.wav'],
      deharmony: ['mock-deharmony.wav'],
      dereverb: ['mock-dereverb.wav']
    };
    let token = '';
    const expanded = new Set();
    const kind = document.querySelector('#kind');
    const model = document.querySelector('#model');
    const params = document.querySelector('#rift-params');
    function updateModels() {
      model.replaceChildren();
      for (const entry of modelCatalog[kind.value] || []) {
        const option = document.createElement('option'); option.value = entry.name; option.textContent = entry.name;
        model.appendChild(option);
      }
    }
    kind.addEventListener('change', () => { params.hidden = kind.value !== 'rift'; updateModels(); });
    updateModels();
    const headers = () => token ? {Authorization: `Bearer ${token}`} : {};
    function appendMockFileLinks(job, target) {
      for (const name of mockFiles[job.kind] || ['mock-output.wav']) {
        const link = document.createElement('a'); link.className = 'mock-file'; link.textContent = `${name}（模拟）`;
        link.href = `data:application/octet-stream;charset=utf-8,${encodeURIComponent(`RIFT Queue mock artifact\njob=${job.id}\nfile=${name}\n`)}`;
        link.download = name; target.appendChild(link);
      }
    }
    async function request(path, options={}) {
      options.headers = {...(options.headers || {}), ...headers()};
      const response = await fetch(path, options);
      if (!response.ok) {
        let detail = `${response.status}`;
        try { detail = (await response.json()).detail || detail; } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }
    async function enter() {
      const me = await request('/api/me');
      document.querySelector('#identity').textContent = me.username;
      document.querySelector('#logout').hidden = false;
      document.querySelector('#token').hidden = true;
      document.querySelector('#login-form button[type="submit"]').hidden = true;
      document.querySelector('#submit-form').hidden = false;
      await refresh();
    }
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault(); token = document.querySelector('#token').value;
      try {
        await request('/api/session', {method:'POST'}); token = ''; document.querySelector('#token').value = ''; await enter();
      } catch (error) { document.querySelector('#login-error').textContent = error.message; }
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/api/session', {method:'DELETE', headers: headers()});
      token = ''; document.querySelector('#logout').hidden = true;
      document.querySelector('#token').hidden = false;
      document.querySelector('#login-form button[type="submit"]').hidden = false;
      document.querySelector('#submit-form').hidden = true;
      document.querySelector('#identity').textContent = '未登录'; await refresh();
    });
    document.querySelector('#submit-form').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.querySelector('#submit-status'); status.textContent = '上传中…';
      try {
        await request('/api/jobs', {method:'POST', body:new FormData(event.target)});
        event.target.reset(); status.textContent = '已进入队列'; await refresh();
      } catch (error) { status.textContent = error.message; }
    });
    async function detail(id) {
      const job = await request(`/api/jobs/${id}`);
      expanded.add(id);
      let target = document.querySelector(`[data-files="${id}"]`);
      if (!target) {
        await refresh();
        target = document.querySelector(`[data-files="${id}"]`);
      }
      target.innerHTML = '';
      if (job.files && job.files.length) {
        for (const file of job.files) {
          const link = document.createElement('a'); link.textContent = file.name; link.href = file.url; link.download = file.name;
          target.appendChild(link);
        }
      } else {
        appendMockFileLinks(job, target);
      }
    }
    async function refresh() {
      const jobs = await request('/api/jobs'); const root = document.querySelector('#jobs'); root.innerHTML = '';
      for (const job of jobs) {
        const node = document.createElement('div'); node.className = `job ${job.owned ? 'mine' : ''}`;
        const main = document.createElement('div'); main.className = 'job-main';
        const number = document.createElement('strong'); number.className = 'queue-number'; number.textContent = job.queue_position || '—';
        const owner = document.createElement('strong'); owner.className = 'owner'; owner.textContent = job.username;
        const summary = document.createElement('div');
        const title = document.createElement('div'); title.textContent = job.title;
        const kind = document.createElement('span'); kind.textContent = job.kind_label;
        const state = document.createElement('span'); state.textContent = labels[job.status];
        summary.append(title);
        main.append(number, owner, summary, kind, state);
        if (job.owned && job.status === 'queued') {
          const cancel = document.createElement('button'); cancel.className = 'cancel'; cancel.textContent = '取消';
          cancel.onclick = async event => { event.stopPropagation(); await request(`/api/jobs/${job.id}/cancel`, {method:'POST'}); await refresh(); };
          main.appendChild(cancel);
        }
        const details = document.createElement('div'); details.className = 'job-details';
        if (expanded.has(job.id)) {
          const model = document.createElement('div'); model.className = 'detail-item';
          const modelLabel = document.createElement('span'); modelLabel.className = 'detail-label'; modelLabel.textContent = '模型（示例）';
          const modelLinks = document.createElement('span'); modelLinks.className = 'model-links detail-value';
          for (const entry of modelCatalog[job.kind] || []) {
            for (const source of entry.links || [entry]) {
              const link = document.createElement('a'); link.href = source.url; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = source.name;
              if (entry.mock || source.mock) link.className = 'mock-file';
              modelLinks.appendChild(link);
            }
          }
          model.append(modelLabel, modelLinks);
          const parameterGrid = document.createElement('div'); parameterGrid.className = 'detail-grid';
          if (job.kind === 'rift' && job.params) {
            for (const [key, value] of Object.entries(job.params)) {
              const item = document.createElement('div'); item.className = 'detail-item';
              const label = document.createElement('span'); label.className = 'detail-label'; label.textContent = paramLabels[key] || key;
              const displayValue = key === 'robust_f0' ? (f0Labels[value] || value) : value;
              const content = document.createElement('span'); content.className = 'detail-value'; content.textContent = displayValue;
              item.append(label, content); parameterGrid.appendChild(item);
            }
          }
          const meta = document.createElement('div'); meta.className = 'detail-id'; meta.textContent = `任务编号：${job.id}`;
          const files = document.createElement('div'); files.className = 'files'; files.dataset.files = job.id;
          details.append(model, parameterGrid, meta, files);
          if (job.status !== 'succeeded') appendMockFileLinks(job, files);
        }
        node.append(main, details);
        root.appendChild(node);
        if (job.owned) {
          node.onclick = () => { if (job.status === 'succeeded') detail(job.id); else { expanded.has(job.id) ? expanded.delete(job.id) : expanded.add(job.id); refresh(); } };
          if (expanded.has(job.id) && job.status === 'succeeded') detail(job.id).catch(() => {});
        }
      }
    }
    enter().catch(() => {});
    setInterval(() => document.querySelector('#app').hidden || refresh().catch(()=>{}), 5000);
  </script>
</body>
</html>
