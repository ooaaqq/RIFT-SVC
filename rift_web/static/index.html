<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RIFT Queue</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #101113;
      --panel: #17191c;
      --panel-soft: #141619;
      --line: #2b2e34;
      --line-strong: #3a3f48;
      --text: #eef0f4;
      --muted: #9298a3;
      --accent: #8fb3ff;
      --danger: #ef8f8f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45; }
    main { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 72px; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 680; letter-spacing: -.02em; }
    form { display: grid; gap: 12px; }
    input, select, button { min-height: 42px; border: 1px solid var(--line-strong); border-radius: 7px; background: #1b1d21; color: var(--text); font: inherit; }
    input, select { width: 100%; padding: 9px 11px; outline: none; }
    input[type="number"] { appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { margin: 0; appearance: none; }
    input:focus, select:focus { border-color: #718fc7; box-shadow: 0 0 0 2px rgb(113 143 199 / 15%); }
    button { padding: 8px 14px; cursor: pointer; font-weight: 600; }
    button:hover { border-color: #5b6270; background: #22252a; }
    input[type="file"] { padding: 5px; color: var(--muted); }
    input[type="file"]::file-selector-button { height: 30px; margin-right: 9px; border: 0; border-radius: 5px; padding: 0 10px; background: #2a2d33; color: var(--text); cursor: pointer; }
    .select-wrap { position: relative; min-width: 0; }
    .select-wrap:not(.enhanced)::after { content: ''; position: absolute; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); right: 14px; top: 50%; transform: translateY(-65%) rotate(45deg); pointer-events: none; }
    .select-wrap:not(.enhanced) select { appearance: none; padding-right: 38px; }
    .select-native { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .select-trigger { display: flex; width: 100%; min-height: 42px; min-width: 0; align-items: center; justify-content: space-between; gap: 12px; overflow: hidden; padding: 9px 12px; background: #181a1e; font-weight: 400; text-align: left; }
    .select-trigger-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .select-trigger::after { content: ''; width: 7px; height: 7px; flex: 0 0 auto; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-2px) rotate(45deg); transition: transform .15s ease; }
    .select-wrap.open .select-trigger { border-color: #718fc7; box-shadow: 0 0 0 2px rgb(113 143 199 / 15%); }
    .select-wrap.open .select-trigger::after { transform: translateY(2px) rotate(225deg); }
    .select-menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; left: 0; display: grid; gap: 2px; max-height: 250px; overflow-y: auto; padding: 5px; border: 1px solid var(--line-strong); border-radius: 8px; background: #202328; box-shadow: 0 16px 38px rgb(0 0 0 / 38%); }
    .select-option { width: 100%; min-height: 34px; border: 0; border-radius: 5px; background: transparent; padding: 7px 9px; color: #d6d9df; font-weight: 400; text-align: left; }
    .select-option:hover { border: 0; background: #292d34; }
    .select-option.selected { background: #303746; color: #dce7ff; }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); font-size: .84rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .account { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
    .inline-login { display: flex; align-items: center; gap: 7px; margin: 0; }
    .inline-login input { width: 150px; min-height: 36px; }
    .inline-login button, #logout { min-height: 36px; padding: 6px 10px; background: transparent; }
    #logout { border-color: transparent; color: var(--muted); }
    #logout:hover { color: var(--text); background: #1c1e22; }
    #submit-form { padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft); }
    #submit-form input, #submit-form select { background: #181a1e; }
    .row { display: grid; grid-template-columns: minmax(250px, 1.5fr) 145px minmax(240px, 1fr) 200px; gap: 10px; align-items: center; }
    .model-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 22px; }
    .model-note { display: grid; align-content: start; gap: 3px; min-width: 0; }
    .model-note-name { color: #d9dde4; font-size: .8rem; font-weight: 600; }
    .model-note-description { color: var(--muted); font-size: .76rem; }
    .model-info-links { display: flex; flex-wrap: wrap; gap: 7px 12px; font-size: .74rem; }
    .params { display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); gap: 10px; padding-top: 2px; }
    .params label { position: relative; color: var(--muted); font-size: .76rem; }
    .params label[data-tip] { cursor: help; text-decoration: underline dotted #59606c; text-underline-offset: 3px; }
    .params label[data-tip]::after { content: attr(data-tip); position: absolute; z-index: 40; bottom: calc(100% + 8px); left: 0; width: max-content; max-width: 230px; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: #24272d; box-shadow: 0 8px 24px rgb(0 0 0 / 30%); color: #d6dae1; font-size: .75rem; font-weight: 400; line-height: 1.4; opacity: 0; pointer-events: none; transform: translateY(3px); transition: opacity .12s ease, transform .12s ease; }
    .params label[data-tip]:hover::after { opacity: 1; transform: translateY(0); }
    .params .select-wrap { display: block; }
    .params input, .params select { min-height: 38px; margin-top: 5px; color: var(--text); }
    .params .select-trigger { min-height: 38px; margin-top: 5px; }
    .submit-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    #submit-form > .submit-footer button { min-width: 100px; min-height: 38px; border-color: #46566f; background: transparent; color: #b8ccf2; }
    #submit-form > .submit-footer button:hover { border-color: #61779a; background: #1d2430; color: #dbe6ff; }
    .queue-shell { overflow: hidden; margin-top: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft); }
    .queue-head, .job-main { display: grid; grid-template-columns: 52px 160px minmax(180px, 1fr) 110px 110px 64px; gap: 12px; align-items: center; }
    .queue-head { padding: 11px 16px 10px; border-bottom: 1px solid var(--line); background: #181a1e; color: var(--muted); font-size: .72rem; letter-spacing: .025em; }
    .job-main > *, .queue-head > * { min-width: 0; text-align: left; }
    .jobs { display: grid; }
    .job { position: relative; padding: 13px 16px; border-bottom: 1px solid #24272c; background: transparent; transition: background-color .15s ease; }
    .job:last-child { border-bottom: 0; }
    .job:hover { background: #1a1d21; }
    .job.mine { cursor: pointer; }
    .queue-number { color: #7d8490; font-variant-numeric: tabular-nums; font-size: .85rem; font-weight: 650; }
    .owner { overflow: hidden; color: #c2c6ce; font-size: .88rem; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .job-title { overflow: hidden; font-weight: 580; text-overflow: ellipsis; white-space: nowrap; }
    .job-kind { color: var(--muted); font-size: .84rem; }
    .status { font-size: .84rem; white-space: nowrap; }
    .status-queued { color: #b9bec8; }
    .status-running { color: #8fb3ff; }
    .status-succeeded { color: #8ed1aa; }
    .status-failed { color: #ef9b9b; }
    .status-cancelled { color: #858b95; }
    .cancel { min-height: 30px; border: 0; background: transparent; padding: 3px 0; color: var(--danger); font-size: .84rem; text-align: left; }
    .cancel:hover { border: 0; background: transparent; color: #ffb0b0; }
    .job-details { display: grid; gap: 16px; margin: 16px 0 3px 224px; padding: 15px 17px; border-radius: 8px; background: #121417; }
    .job-details:empty { display: none; }
    .detail-section { display: grid; gap: 7px; }
    .detail-heading { color: var(--muted); font-size: .72rem; font-weight: 650; letter-spacing: .04em; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px 22px; }
    .detail-item { min-width: 0; }
    .detail-label { display: block; color: var(--muted); font-size: .74rem; }
    .detail-value { display: block; margin-top: 3px; overflow-wrap: anywhere; }
    .model-links, .files { display: flex; flex-wrap: wrap; gap: 7px 16px; }
    .file-columns { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 24px; }
    .file-column { display: grid; align-content: start; gap: 6px; min-width: 0; }
    .file-column-heading { color: var(--muted); font-size: .74rem; }
    a { color: #9fbdff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .detail-id { color: #717783; font: .72rem ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .mock-file { color: #858b96; }
    @media (max-width: 900px) {
      .row { grid-template-columns: minmax(220px, 1fr) 150px; }
      .params { grid-template-columns: repeat(4, minmax(90px, 1fr)); }
      .queue-head, .job-main { grid-template-columns: 42px 130px minmax(140px, 1fr) 90px 95px 54px; gap: 9px; }
      .job-details { margin-left: 181px; }
    }
    @media (max-width: 650px) {
      main { width: min(100% - 24px, 1120px); padding-top: 22px; }
      .topbar { align-items: flex-start; flex-wrap: wrap; }
      .account { width: 100%; justify-content: flex-start; }
      .inline-login { flex: 1; }
      .row { grid-template-columns: 1fr; }
      .params { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .queue-shell { border-radius: 9px; }
      .queue-head { display: none; }
      .job { padding: 14px; }
      .job-main { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px 10px; }
      .job-main > :nth-child(2) { grid-column: 2; }
      .job-main > :nth-child(3) { grid-column: 2; }
      .job-main > :nth-child(4), .job-main > :nth-child(5) { font-size: .82rem; }
      .job-main > :nth-child(6) { grid-column: 3; grid-row: 1; }
      .job-details { margin-left: 44px; }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .file-columns { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1>RIFT Queue</h1>
      <div class="account">
        <span id="identity" class="muted">未登录</span>
        <form id="login-form" class="inline-login">
          <input id="token" type="password" placeholder="口令" required autocomplete="current-password">
          <button type="submit">登录</button>
          <button id="logout" hidden type="button">退出</button>
          <span id="login-error" class="muted"></span>
        </form>
      </div>
    </header>
    <form id="submit-form" hidden>
      <div class="row">
        <input name="title" maxlength="100" placeholder="任务名 / 歌曲名" required>
        <div class="select-wrap">
          <select name="kind" id="kind" required>
            <option value="rift" selected>音色转换</option>
            <option value="background">提取干声</option>
            <option value="deharmony">去和声</option>
            <option value="dereverb">去混响</option>
          </select>
        </div>
        <div class="select-wrap">
          <select name="model" id="model" required aria-label="模型"></select>
        </div>
        <input name="upload" type="file" accept="audio/*,.wav,.flac,.m4a,.mp3,.ogg,.opus" required>
      </div>
      <div id="model-info" class="model-info"></div>
      <div id="rift-params" class="params">
        <label data-tip="整体升降音高；1 表示一个半音。">变调（半音） <input name="key_shift" type="number" min="-24" max="24" value="0"></label>
        <label data-tip="采样迭代次数；越高越慢，通常更稳定。">推理步数 <input name="steps" type="number" min="2" max="128" value="32"></label>
        <label data-tip="内容引导强度；越高越强调输入的发音与旋律细节。">内容 CFG <input name="ds" type="number" min="0" max="2" step="0.05" value="0.2"></label>
        <label data-tip="目标音色引导强度；越高越强调目标说话人特征。">音色 CFG <input name="spk" type="number" min="0" max="2" step="0.05" value="0.8"></label>
        <label data-tip="约束 CFG 引起的能量变化，避免引导过强。">CFG 重采样 <input name="cfg_rescale" type="number" min="0" max="2" step="0.05" value="0.7"></label>
        <label data-tip="融合多种音高估计；复杂音高时可尝试轻量或完整。">F0 融合 <span class="select-wrap"><select name="robust_f0"><option value="0" selected>关闭</option><option value="1">轻量</option><option value="2">完整</option></select></span></label>
        <label data-tip="控制初始噪声；相同输入和参数可复现结果。">随机种子 <input name="seed" type="number" min="0" value="7"></label>
      </div>
      <div class="submit-footer">
        <span id="submit-status" class="muted"></span>
        <button>提交任务</button>
      </div>
    </form>
    <div class="queue-shell">
      <div class="queue-head"><span>序号</span><span>提交人</span><span>标题</span><span>类型</span><span>状态</span><span>操作</span></div>
      <div id="jobs" class="jobs"></div>
    </div>
  </main>

  <script>
    const labels = {queued:'○ 等待',running:'● 处理中',succeeded:'✓ 完成',failed:'× 失败',cancelled:'— 已取消'};
    const paramLabels = {key_shift:'变调（半音）', steps:'推理步数', ds:'内容 CFG', spk:'音色 CFG', cfg_rescale:'CFG 重采样', robust_f0:'F0 融合', seed:'随机种子'};
    const f0Labels = {0:'关闭', 1:'轻量', 2:'完整'};
    let modelCatalog = {};
    const mockFiles = {
      rift: ['mock-rift-vocal.wav', 'mock-rift-manifest.json'],
      background: ['mock-background-vocal.wav', 'mock-background-instrumental.wav'],
      deharmony: ['mock-deharmony.wav'],
      dereverb: ['mock-dereverb.wav']
    };
    let token = '';
    const expanded = new Set();
    const detailCache = new Map();
    const kind = document.querySelector('#kind');
    const model = document.querySelector('#model');
    const modelInfo = document.querySelector('#model-info');
    const params = document.querySelector('#rift-params');
    function enhanceSelect(select) {
      const wrapper = select.closest('.select-wrap');
      if (!wrapper || wrapper.classList.contains('enhanced')) return;
      wrapper.classList.add('enhanced'); select.classList.add('select-native');
      const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'select-trigger';
      const triggerText = document.createElement('span'); triggerText.className = 'select-trigger-text'; trigger.appendChild(triggerText);
      const menu = document.createElement('div'); menu.className = 'select-menu'; menu.hidden = true;
      function close() { wrapper.classList.remove('open'); menu.hidden = true; }
      function refresh() {
        triggerText.textContent = select.selectedOptions[0]?.textContent || '';
        trigger.title = triggerText.textContent;
        menu.replaceChildren();
        for (const nativeOption of select.options) {
          const option = document.createElement('button'); option.type = 'button'; option.className = 'select-option';
          option.textContent = nativeOption.textContent; option.classList.toggle('selected', nativeOption.selected);
          option.onclick = event => {
            event.stopPropagation(); select.value = nativeOption.value; select.dispatchEvent(new Event('change', {bubbles:true})); refresh(); close();
          };
          menu.appendChild(option);
        }
      }
      trigger.onclick = event => {
        event.stopPropagation();
        const opening = menu.hidden;
        document.querySelectorAll('.select-wrap.open').forEach(open => {
          if (open !== wrapper) { open.classList.remove('open'); open.querySelector('.select-menu').hidden = true; }
        });
        wrapper.classList.toggle('open', opening); menu.hidden = !opening;
      };
      select._refreshCustom = refresh; wrapper.append(trigger, menu); refresh();
    }
    function updateModelInfo() {
      modelInfo.replaceChildren();
      if (kind.value === 'rift') { modelInfo.hidden = true; return; }
      modelInfo.hidden = false;
      for (const entry of modelCatalog[kind.value] || []) {
        const note = document.createElement('div'); note.className = 'model-note';
        const name = document.createElement('div'); name.className = 'model-note-name'; name.textContent = entry.label;
        const description = document.createElement('div'); description.className = 'model-note-description'; description.textContent = entry.description;
        const links = document.createElement('div'); links.className = 'model-info-links'; links.append('开源地址：');
        for (const source of entry.sources || []) {
          const link = document.createElement('a'); link.href = source.url; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = source.label;
          links.appendChild(link);
        }
        note.append(name, description, links); modelInfo.appendChild(note);
      }
    }
    function updateModels() {
      model.replaceChildren();
      for (const entry of modelCatalog[kind.value] || []) {
        const option = document.createElement('option'); option.value = entry.id; option.textContent = entry.label;
        model.appendChild(option);
      }
      model._refreshCustom?.();
      updateModelInfo();
    }
    kind.addEventListener('change', () => { params.hidden = kind.value !== 'rift'; updateModels(); });
    document.addEventListener('click', () => document.querySelectorAll('.select-wrap.open').forEach(wrapper => {
      wrapper.classList.remove('open'); wrapper.querySelector('.select-menu').hidden = true;
    }));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.dispatchEvent(new Event('click'));
    });
    const headers = () => token ? {Authorization: `Bearer ${token}`} : {};
    function appendMockFileLinks(job, target) {
      for (const name of mockFiles[job.kind] || ['mock-output.wav']) {
        const link = document.createElement('a'); link.className = 'mock-file'; link.textContent = `${name}（模拟）`;
        link.href = `data:application/octet-stream;charset=utf-8,${encodeURIComponent(`RIFT Queue mock artifact\njob=${job.id}\nfile=${name}\n`)}`;
        link.download = name; target.appendChild(link);
      }
    }
    async function request(path, options={}) {
      options.headers = {...(options.headers || {}), ...headers()};
      const response = await fetch(path, options);
      if (!response.ok) {
        let detail = `${response.status}`;
        try { detail = (await response.json()).detail || detail; } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }
    async function enter() {
      const me = await request('/api/me');
      document.querySelector('#identity').textContent = me.username;
      document.querySelector('#logout').hidden = false;
      document.querySelector('#token').hidden = true;
      document.querySelector('#login-form button[type="submit"]').hidden = true;
      document.querySelector('#submit-form').hidden = false;
      await refresh();
    }
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault(); token = document.querySelector('#token').value;
      try {
        await request('/api/session', {method:'POST'}); token = ''; document.querySelector('#token').value = ''; await enter();
      } catch (error) { document.querySelector('#login-error').textContent = error.message; }
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/api/session', {method:'DELETE', headers: headers()});
      token = ''; document.querySelector('#logout').hidden = true;
      document.querySelector('#token').hidden = false;
      document.querySelector('#login-form button[type="submit"]').hidden = false;
      document.querySelector('#submit-form').hidden = true;
      document.querySelector('#identity').textContent = '未登录'; await refresh();
    });
    document.querySelector('#submit-form').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.querySelector('#submit-status'); status.textContent = '上传中…';
      try {
        await request('/api/jobs', {method:'POST', body:new FormData(event.target)});
        event.target.reset(); params.hidden = false; updateModels();
        document.querySelectorAll('.select-wrap select').forEach(select => select._refreshCustom?.());
        status.textContent = '已进入队列'; await refresh();
      } catch (error) { status.textContent = error.message; }
    });
    async function detail(id) {
      const job = await request(`/api/jobs/${id}`);
      detailCache.set(id, job); expanded.add(id); await refresh();
    }
    async function refresh() {
      const jobs = await request('/api/jobs'); const root = document.querySelector('#jobs'); root.innerHTML = '';
      for (const job of jobs) {
        const node = document.createElement('div'); node.className = `job ${job.owned ? 'mine' : ''}`;
        const main = document.createElement('div'); main.className = 'job-main';
        const number = document.createElement('strong'); number.className = 'queue-number'; number.textContent = job.queue_position || '—';
        const owner = document.createElement('strong'); owner.className = 'owner'; owner.textContent = job.username;
        const summary = document.createElement('div');
        const title = document.createElement('div'); title.className = 'job-title'; title.textContent = job.title; title.title = job.title;
        const kind = document.createElement('span'); kind.className = 'job-kind'; kind.textContent = job.kind_label;
        const state = document.createElement('span'); state.className = `status status-${job.status}`; state.textContent = labels[job.status];
        summary.append(title);
        main.append(number, owner, summary, kind, state);
        if (job.owned && job.status === 'queued') {
          const cancel = document.createElement('button'); cancel.className = 'cancel'; cancel.textContent = '取消';
          cancel.onclick = async event => { event.stopPropagation(); await request(`/api/jobs/${job.id}/cancel`, {method:'POST'}); await refresh(); };
          main.appendChild(cancel);
        }
        const details = document.createElement('div'); details.className = 'job-details';
        if (expanded.has(job.id)) {
          const privateJob = detailCache.get(job.id);
          const modelSection = document.createElement('section'); modelSection.className = 'detail-section';
          const modelHeading = document.createElement('div'); modelHeading.className = 'detail-heading'; modelHeading.textContent = '处理模型';
          const modelName = document.createElement('div'); modelName.className = 'detail-value'; modelName.textContent = job.model_label;
          modelSection.append(modelHeading, modelName);
          const parameterSection = document.createElement('section'); parameterSection.className = 'detail-section';
          const parameterHeading = document.createElement('div'); parameterHeading.className = 'detail-heading'; parameterHeading.textContent = '参数';
          const parameterGrid = document.createElement('div'); parameterGrid.className = 'detail-grid';
          if (job.kind === 'rift' && job.params) {
            for (const [key, value] of Object.entries(job.params)) {
              const item = document.createElement('div'); item.className = 'detail-item';
              const label = document.createElement('span'); label.className = 'detail-label'; label.textContent = paramLabels[key] || key;
              const displayValue = key === 'robust_f0' ? (f0Labels[value] || value) : value;
              const content = document.createElement('span'); content.className = 'detail-value'; content.textContent = displayValue;
              item.append(label, content); parameterGrid.appendChild(item);
            }
          }
          parameterSection.append(parameterHeading, parameterGrid);
          if (job.kind !== 'rift') parameterSection.hidden = true;
          const fileSection = document.createElement('section'); fileSection.className = 'detail-section';
          const fileHeading = document.createElement('div'); fileHeading.className = 'detail-heading'; fileHeading.textContent = '文件';
          const meta = document.createElement('div'); meta.className = 'detail-id'; meta.textContent = `任务编号：${job.id}`;
          const columns = document.createElement('div'); columns.className = 'file-columns';
          const inputColumn = document.createElement('div'); inputColumn.className = 'file-column';
          const inputHeading = document.createElement('div'); inputHeading.className = 'file-column-heading'; inputHeading.textContent = '输入文件';
          const inputLink = document.createElement('a'); inputLink.textContent = privateJob?.original_name || '—'; inputLink.href = privateJob?.input_url || '#'; inputLink.download = privateJob?.original_name || '';
          inputColumn.append(inputHeading, inputLink);
          const outputColumn = document.createElement('div'); outputColumn.className = 'file-column';
          const outputHeading = document.createElement('div'); outputHeading.className = 'file-column-heading'; outputHeading.textContent = '输出文件';
          const files = document.createElement('div'); files.className = 'files'; files.dataset.files = job.id;
          if (privateJob?.files?.length) {
            for (const file of privateJob.files) {
              const link = document.createElement('a'); link.textContent = file.name; link.href = file.url; link.download = file.name; files.appendChild(link);
            }
          } else appendMockFileLinks(job, files);
          outputColumn.append(outputHeading, files); columns.append(inputColumn, outputColumn);
          fileSection.append(fileHeading, columns);
          details.append(modelSection, parameterSection, fileSection, meta);
        }
        node.append(main, details);
        details.onclick = event => event.stopPropagation();
        root.appendChild(node);
        if (job.owned) {
          node.onclick = () => {
            if (expanded.has(job.id)) { expanded.delete(job.id); refresh(); }
            else detail(job.id);
          };
        }
      }
    }
    async function initialize() {
      const options = await request('/api/options'); modelCatalog = options.models;
      for (const option of kind.options) option.textContent = options.kinds[option.value] || option.textContent;
      updateModels(); document.querySelectorAll('.select-wrap select').forEach(enhanceSelect);
      await enter().catch(() => refresh());
    }
    initialize().catch(error => { document.querySelector('#login-error').textContent = error.message; });
    setInterval(() => document.querySelector('#app').hidden || refresh().catch(()=>{}), 5000);
  </script>
</body>
</html>
