[project]
name = "rift-svc"
version = "0.1.0"
description = "Inference tools for RIFT-SVC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.3.0",
    "einops>=0.8.1",
    "huggingface-hub>=0.36.0",
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "praat-parselmouth>=0.4.6",
    "pyloudnorm>=0.1.1",
    "pyworld>=0.3.5",
    "scipy>=1.14.0",
    "setuptools<81",
    "soundfile>=0.13.1",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.0",
    "x-transformers>=2.10.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]
web = [
    "fastapi>=0.116.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
torchaudio = [
  {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
