[project]
name = "rift-svc"
version = "0.1.0"
description = "Inference and training tools for RIFT-SVC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.0",
    "einops>=0.8.1",
    "huggingface-hub>=0.36.0",
    "jaxtyping>=0.3.3",
    "librosa>=0.11.0",
    "praat-parselmouth>=0.4.6",
    "pyloudnorm>=0.1.1",
    "pyworld>=0.3.5",
    "pyyaml>=6.0.2",
    "resampy>=0.4.3",
    "soundfile>=0.13.1",
    "tokenizers>=0.22",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.67.1",
    "transformers>=4.57.0",
    "x-transformers>=2.10.2",
]

[project.optional-dependencies]
training = [
    "hydra-core>=1.3.2",
    "lightning>=2.5.5",
    "matplotlib>=3.10.7",
    "omegaconf>=2.3.0",
    "schedulefree>=1.4.1",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "thop>=0.1.1.post2209072238",
    "torchcodec>=0.8.1",
    "wandb>=0.22.3",
]
gui = [
    "gradio>=5.49.1",
]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["slicer"]

[tool.setuptools.packages.find]
include = ["rift_svc*"]
exclude = ["assets*", "config*", "data*", "kaggle*", "pretrained*"]


[tool.uv.sources]
torch = [
  {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
torchaudio = [
  {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
